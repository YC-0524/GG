databases:
  - name: game-db
    databaseName: game
    user: game
    plan: free

services:
  - type: web
    name: game
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: game-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: game-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: game-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: game-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: game-db
          property: password
      # Staff accounts, created on startup by StaffAccountSeeder. Set in the Render dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MODERATOR_EMAIL
        sync: false
      - key: MODERATOR_PASSWORD
        sync: false

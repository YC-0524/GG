
spring.application.name=game

# Discord OAuth
discord.oauth.client_id=${DISCORD_CLIENT_ID}
discord.oauth.client_secret=${DISCORD_CLIENT_SECRET}
discord.oauth.redirect_uri=${DISCORD_REDIRECT_URI}
discord.oauth.oauth_uri=${DISCORD_OAUTH_URI}

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Database
spring.jpa.open-in-view=false

# Server
server.port=8080

# Profile pictures (US 44): the app itself rejects files over 2 MB with a clear message.
# These limits are higher so most too-big photos still reach that check.
# Anything over them shows templates/error/413.html instead.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=-1

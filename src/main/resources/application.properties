spring.application.name=game

# For logging in with Discord. Get them for Discord Developer Portal -> Application -> OAuth2
discord.oauth.client_id=${DISCORD_CLIENT_ID}
discord.oauth.client_secret=${DISCORD_CLIENT_SECRET}
# This will be something like https://gg.on-render.com/auth/discord
discord.oauth.redirect_uri=${DISCORD_REDIRECT_URI}
# This will actually redirect to Discord's OAuth flow
discord.oauth.oauth_uri=${DISCORD_OAUTH_URI}
# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

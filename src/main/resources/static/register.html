<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Gang Register</title>
</head>
<body>
    <a href="/">Home</a>
    <form action="/auth/register-email" method="POST">
        <input type="text" placeholder="Your username..." name="username" required id="username">
        <input type="email" placeholder="Your email..." required name="email" id="email">
        <input type="password" name="password" id="password" required placeholder="Your password...">
        <button type="submit">Register</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Gang Login</title>
</head>
<body>
    <a href="/">Home</a>
    <form action="/auth/login-email" method="POST">
        <input type="email" required placeholder="Your email..." name="email" id="email">
        <input type="password" required name="password" id="password" placeholder="Your password...">
        <button type="submit">Login</button>
    </form>
    <span>or</span>
    <a href="/auth/discord">Login with Discord</a>
</body>
</html>

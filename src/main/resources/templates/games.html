<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games | GAME GANG</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/games.css">
</head>

<body>
    <div class="app-container">
        <nav th:replace="~{sideNavigation :: sideNavigation(selectedNav='games')}"></nav>
        <div class="content-container games-container">
            <h2>My Games</h2>

            <form class="add-game-form" th:action="@{/games}" method="post">
                <div class="field">
                    <label for="game-search">Search games</label>
                    <input type="text" id="game-search" name="gameName" list="game-options"
                        placeholder="Type a game name" autocomplete="off" required>
                    <datalist id="game-options">
                        <option th:each="game : ${catalog}" th:value="${game.key}"
                            th:attr="data-ranks=${#strings.listJoin(game.value, '|')}"></option>
                    </datalist>
                </div>
                <div class="field">
                    <label for="game-rank">Current rank</label>
                    <span class="select-wrap">
                        <select id="game-rank" name="rank" disabled>
                            <option value="Unranked">Unranked</option>
                        </select>
                    </span>
                </div>
                <button type="submit" id="add-game-button" disabled>Add game</button>
            </form>
            <p id="game-search-status" class="form-message error" role="status"></p>
            <p class="form-message error" th:if="${error}" th:text="${error}" role="alert"></p>
            <p class="form-message" th:if="${success}" th:text="${success}" role="status"></p>

            <p th:if="${#lists.isEmpty(entries)}" class="form-message">No games added yet</p>
            <table class="games-table" th:unless="${#lists.isEmpty(entries)}">
                <thead>
                    <tr>
                        <th>Game</th>
                        <th>Rank</th>
                        <th>Show In Matches?</th>
                        <th><span class="visually-hidden">Actions</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${entries}">
                        <td th:text="${entry.gameName}">Valorant</td>

                        <!-- Rank: plain text, or a rank picker while this row is being edited.
                             The picker sits in the Rank column but belongs to the Save form in the
                             last column through its form="..." attribute. -->
                        <td th:if="${editId != entry.id}" th:text="${entry.rank}">Gold 2</td>
                        <td th:if="${editId == entry.id}">
                            <span class="select-wrap">
                                <select name="rank"
                                    th:attr="form=|edit-game-${entry.id}|,aria-label=|Rank for ${entry.gameName}|">
                                    <option value="Unranked" th:selected="${entry.rank == 'Unranked'}">Unranked</option>
                                    <option th:each="rank : ${catalog[entry.gameName]}" th:value="${rank}"
                                        th:text="${rank}" th:selected="${rank == entry.rank}"></option>
                                </select>
                            </span>
                        </td>

                        <!-- Show in matches switch (US23), shown in both modes -->
                        <td>
                            <form th:action="@{/games/{id}/searchable(id=${entry.id})}" method="post"
                                class="search-toggle-form">
                                <input type="hidden" name="searchable" th:value="${!entry.searchable}">
                                <button type="submit" class="search-toggle" role="switch"
                                    th:attr="aria-checked=${entry.searchable},aria-label=|Show me in matches for ${entry.gameName}|">
                                    <span class="search-toggle-track"><span class="search-toggle-thumb"></span></span>
                                    <span th:text="${entry.searchable} ? 'On' : 'Off'">On</span>
                                </button>
                            </form>
                        </td>

                        <!-- Actions: Edit/Remove, or Save/Cancel while editing -->
                        <td th:if="${editId != entry.id}">
                            <div class="game-actions">
                                <a th:href="@{/games(edit=${entry.id})}">Edit</a>
                                <form th:action="@{/games/{id}/delete(id=${entry.id})}" method="post"
                                    class="remove-game-form" th:attr="data-game=${entry.gameName}">
                                    <button type="submit" class="link-button">Remove</button>
                                </form>
                            </div>
                        </td>
                        <td th:if="${editId == entry.id}">
                            <form th:id="|edit-game-${entry.id}|" th:action="@{/games/{id}/edit(id=${entry.id})}"
                                method="post" class="game-actions edit-game-form">
                                <button type="submit">Save</button>
                                <a th:href="@{/games}">Cancel</a>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="/js/games.js" defer></script>
</body>

</html>

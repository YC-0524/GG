<body>
    <div th:fragment="activityStatus(currentStatus)">
        <link rel="stylesheet" th:href="@{/css/activityStatus.css}" />

        <form th:action="@{/profile/me/status}" method="post" class="status-selector">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <button type="submit" name="status" value="Online"
                th:classappend="${currentStatus.name() == 'ONLINE'} ? ' active' : ''">
                Online
            </button>

            <button type="submit" name="status" value="AFK"
                th:classappend="${currentStatus.name() == 'AFK'} ? ' active' : ''">
                AFK
            </button>

            <button type="submit" name="status" value="Offline"
                th:classappend="${currentStatus.name() == 'OFFLINE'} ? ' active' : ''">
                Offline
            </button>
        </form>
    </div>

</body>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Game Gang - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/playerCards.css">
</head>

<body>
    <div class="dashboard-layout">
        <nav th:replace="~{sideNavigation :: sideNavigation(selectedNav='match')}"></nav>
        <main class="dashboard-main">
            <header class="dashboard-header">
                <h2>Dashboard</h2>
            </header>
            <!-- Actual registered players; the current user is excluded. -->
            <section class="match-section" aria-labelledby="match-title">
                <h2 id="match-title">Find Your Gaming Partner</h2>

                <div class="player-card-stack">
                    <article class="player-card" th:each="player, state : ${players}" th:hidden="${!state.first}"
                        th:attr="aria-labelledby=|player-name-${player.id}|,data-player-id=${player.id}">
                        <div class="player-avatar" aria-hidden="true">
                            <span th:text="${player.initials}">?</span>
                            <img th:if="${player.avatar != null}" th:src="${player.avatar}" alt="Player Profile Picture" referrerpolicy="no-referrer">
                        </div>
                        <h3 th:id="|player-name-${player.id}|" th:text="${player.username}">Player</h3>
                        <section class="tags">
                            <!-- This includes activity status, games, and tags like "CO-OP", "LFG", etc.  -->
                            <div th:replace="~{activityStatus :: activityStatus(${player.activityStatus})}"></div>
                            <div th:replace="~{profileTags :: profileTags(${player.tags})}" th:hidden="{#lists.isEmpty(player.tags)}"></div>
                            <div th:replace="~{profileGames :: profileGames(${player.games})}" th:hidden="{#lists.isEmpty(player.games)}"></div>
                            <!-- Later Iteration: mix the tags and games together for a less rigid appearance, but not important -->
                        </section>
                        <a th:href="@{/profile/{id}(id=${player.id})}">View profile</a>
                    </article>
                </div>

                <div class="match-actions">
                    <button type="button" class="match-action" id="pass-button"
                        th:disabled="${#lists.isEmpty(players)}">
                        <span class="action-circle" aria-hidden="true">
                            <svg viewBox="0 0 48 48" focusable="false">
                                <path d="M12 12L36 36M36 12L12 36" fill="none" stroke="currentColor" stroke-width="8"
                                    stroke-linecap="round" />
                            </svg>
                        </span>
                        <span>Pass</span>
                    </button>
                    <button type="button" class="match-action" id="like-button"
                        th:disabled="${#lists.isEmpty(players)}">
                        <span class="action-circle" aria-hidden="true">
                            <svg viewBox="0 0 48 48" focusable="false">
                                <path d="M24 42L7 25C-5 12 13-2 24 11C35-2 53 12 41 25Z" fill="currentColor" />
                            </svg>
                        </span>
                        <span>Like</span>
                    </button>
                </div>
                <p th:if="${needsAgeRange}">
                    An age is required to see matches.
                </p>
                <p id="match-status" role="status"
                    th:text="${#lists.isEmpty(players) and !needsAgeRange} ? 'No more players to recommend right now.' : ''">
                </p>
            </section>

        </main>
        <aside class="preferences" aria-labelledby="preferences-title">
            <h2 id="preferences-title">
                <span class="preferences-heading-icon" aria-hidden="true"><i></i><i></i><i></i></span>
                My Preferences
            </h2>
            <form id="match-filters" method="get" th:action="@{/dashboard}">
                <fieldset>
                    <legend>Game Genres</legend>
                    <div class="genre-options">
                        <label th:each="genre : ${genres}">
                            <input type="checkbox" name="genre" th:value="${genre}"
                                   th:checked="${selectedGenres.contains(genre)}">
                            <span th:text="${genre}">RPG</span>
                        </label>
                    </div>
                </fieldset>
                <details class="preference-field" th:open="${invalidAgeBounds}">
                    <summary>
                        <span class="preference-icon preference-icon--people" aria-hidden="true"></span>
                        <span class="preference-label">Age Range</span>
                        <span th:text="${minAge == null and maxAge == null ? 'Any' : (minAge ?: minimumAge) + '–' + (maxAge ?: maximumAge)}">Any</span>
                    </summary>
                    <fieldset class="age-filter-bounds">
                        <legend>Age Range</legend>
                        <label for="match-min-age">Minimum age</label>
                        <input id="match-min-age" type="number" name="minAge"
                               th:min="${minimumAge}" th:max="${maximumAge}" th:value="${minAge}"
                               th:placeholder="${minimumAge}">
                        <label for="match-max-age">Maximum age</label>
                        <input id="match-max-age" type="number" name="maxAge"
                               th:min="${minimumAge}" th:max="${maximumAge}" th:value="${maxAge}"
                               th:placeholder="${maximumAge}">
                    </fieldset>
                    <p class="age-filter-error" role="alert" th:if="${invalidAgeBounds}"
                       th:text="|Enter an age range from ${minimumAge} to ${maximumAge}.|"></p>
                </details>
                <details class="preference-field">
                    <summary>
                        <span class="preference-icon preference-icon--globe" aria-hidden="true"></span>
                        <span class="preference-label">Region</span>
                        <span th:text="${selectedRegions.isEmpty() ? 'Any' : (selectedRegions.size() == 1 ? selectedRegions[0].label : selectedRegions.size() + ' selected')}">Any</span>
                    </summary>
                    <fieldset class="preference-options">
                        <legend>Region</legend>
                        <label th:each="option : ${regions}">
                            <input type="checkbox" name="region" th:value="${option.name()}"
                                   th:checked="${selectedRegions.contains(option)}">
                            <span th:text="${option.label}"></span>
                        </label>
                    </fieldset>
                </details>
                <details class="preference-field">
                    <summary>
                        <span class="preference-icon preference-icon--clock" aria-hidden="true"></span>
                        <span class="preference-label">Play Time</span>
                        <span th:text="${selectedPlayTimes.isEmpty() ? 'Any' : (selectedPlayTimes.size() == 1 ? selectedPlayTimes[0] : selectedPlayTimes.size() + ' selected')}">Any</span>
                    </summary>
                    <fieldset class="preference-options">
                        <legend>Play Time</legend>
                        <label th:each="option : ${playTimes}">
                            <input type="checkbox" name="playTime" th:value="${option}"
                                   th:checked="${selectedPlayTimes.contains(option)}">
                            <span th:text="${option}"></span>
                        </label>
                    </fieldset>
                </details>
                <details class="preference-field">
                    <summary>
                        <span class="preference-icon preference-icon--mic" aria-hidden="true"></span>
                        <span class="preference-label">Mic Preference</span>
                        <span th:text="${selectedMics.isEmpty() ? 'Any' : (selectedMics.size() == 1 ? selectedMics[0] : selectedMics.size() + ' selected')}">Any</span>
                    </summary>
                    <fieldset class="preference-options">
                        <legend>Mic Preference</legend>
                        <label th:each="option : ${micOptions}">
                            <input type="checkbox" name="mic" th:value="${option}"
                                   th:checked="${selectedMics.contains(option)}">
                            <span th:text="${option}"></span>
                        </label>
                    </fieldset>
                </details>
                <button class="apply-filters" type="submit">Apply filters</button>
            </form>
        </aside>
    </div>
    <script src="/js/dashboard.js" defer></script>
</body>

</html>

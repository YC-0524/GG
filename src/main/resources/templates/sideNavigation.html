<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="sideNavigation" class="sidebar">
        <link rel="stylesheet" th:href="@{/css/sideNav.css}" />
        <a class="brand" href="/" aria-label="Game Gang home">
            <span class="brand-mark" aria-hidden="true">GG</span>
            <span class="brand-name">GAME GANG</span>
        </a>
        <h1>Game Gang</h1>
        <nav aria-label="Main navigation">
            <a class="nav-link active" href="/dashboard" aria-current="page">Match</a>
            <a class="nav-link" href="/profile/me">Profile</a>
        </nav>
        <section class="sidebar-section">
            <h3>Your Games</h3>
            <p>Browse</p>
        </section>
        <section class="sidebar-section" id="moderator" th:hidden="${user == null || user.role.name() != 'MODERATOR'}">
            <h3>Moderation</h3>
            <p>Review Reports</p>
            <a href="/dashboard/moderator">Open Moderator Tools</a>
        </section>
        <section class="sidebar-section" id="admin" th:hidden="${user == null || user.role.name() != 'ADMIN'}">
            <h3>Admin</h3>
            <p>Review Users</p>
            <a href="/dashboard/admin">Open Admin Tools</a>
        </section>
        <div class="logout-area">
            <div th:replace="~{logout :: logoutButton}"></div>
        </div>
    </div>
</body>

</html>

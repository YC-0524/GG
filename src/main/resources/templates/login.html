
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Gang | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101014;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: #1c1c24;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #444;
            border-radius: 8px;
            background: #292932;
            color: white;
        }

        button, .discord {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #5865F2;
            color: white;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .register {
            color: #7289ff;
        }

        #error {
            color: #ff6464;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Welcome Back</h1>
    <p>Sign in to Game Gang</p>

    <div id="error"></div>

    <form action="/auth/login-email" method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <a class="discord" href="/auth/discord">
        Continue with Discord
    </a>

    <p>
        Don't have an account?
        <a class="register" href="/auth/register">Register</a>
    </p>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");

    if (error) {
        document.getElementById("error").textContent =
            error.replaceAll("+", " ");
    }
</script>

</body>
</html>

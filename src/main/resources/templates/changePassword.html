<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | GAME GANG</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/passwordRules.js" defer></script>
</head>

<body>
    <div class="app-container">
        <nav th:replace="~{sideNavigation :: sideNavigation}"></nav>
        <div class="content-container">
            <form th:action="@{/auth/change-password}" method="POST" style="display: flex; flex-direction: column; gap: 0.5rem; max-width: 420px;">
                <h2>Change Password</h2>
                <span>Enter your current password, then choose a new one.</span>

                <p class="error-message" role="alert" th:if="${param.error}" th:text="${param.error}"></p>

                <input type="password" name="currentPassword" id="currentPassword" placeholder="Current Password"
                    autocomplete="current-password" required />

                <div style="display: flex; flex-direction: column;">
                    <input type="password" name="newPassword" id="newPassword" placeholder="New Password"
                        autocomplete="new-password" aria-describedby="password-rules" required />

                    <ul class="password-rules" id="password-rules" aria-label="Password requirements"
                        data-password-input="newPassword" data-confirm-input="confirmPassword" data-match-message="password-match">
                        <li data-rule="length"><span class="rule-text">At least 8 characters</span><span class="visually-hidden rule-status">, not met</span></li>
                        <li data-rule="upper"><span class="rule-text">One uppercase letter</span><span class="visually-hidden rule-status">, not met</span></li>
                        <li data-rule="lower"><span class="rule-text">One lowercase letter</span><span class="visually-hidden rule-status">, not met</span></li>
                        <li data-rule="number"><span class="rule-text">One number</span><span class="visually-hidden rule-status">, not met</span></li>
                        <li data-rule="symbol"><span class="rule-text">One symbol (e.g. !, @, $, #)</span><span class="visually-hidden rule-status">, not met</span></li>
                    </ul>
                </div>

                <div style="display: flex; flex-direction: column;">
                    <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm New Password"
                        autocomplete="new-password" aria-describedby="password-match" required />
                    <p class="password-match" id="password-match" aria-live="polite"></p>
                </div>

                <button type="submit">Update Password</button>
                <a th:href="@{/profile/me}">Cancel</a>
            </form>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0c16">
    <title>Register for GAME GANG</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/login.js" defer></script>
</head>

<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="register-title">
            <a class="brand" href="/" aria-label="Game Gang home">
                <span class="brand-mark" aria-hidden="true">GG</span>
                <span class="brand-name">GAME GANG</span>
            </a>

            <header class="login-heading">
                <h1 id="register-title">Create an account</h1>
                <p>Join the Game Gang community.</p>
            </header>

            <a class="oauth discord-button" href="/auth/discord">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M19.7 5.1a18 18 0 0 0-4.4-1.4l-.6 1.2a16 16 0 0 0-5.4 0l-.6-1.2a18 18 0 0 0-4.4 1.4C1.5 9.3.7 13.5 1.1 17.6a18 18 0 0 0 5.4 2.7l1.1-1.9-1.7-.8.4-.3a13.6 13.6 0 0 0 11.4 0l.4.3-1.7.8 1.1 1.9a18 18 0 0 0 5.4-2.7c.5-4.8-.8-8.9-3.2-12.5ZM8.4 14.9c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm7.2 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z" />
                </svg>
                Continue with Discord
            </a>

            <!-- Google sign-in button -->
            <a class="oauth google-button" href="/oauth2/authorization/google">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#4285F4"
                        d="M43.6 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11a9.4 9.4 0 0 1-4.1 6.2v5.2h6.7c3.9-3.6 6-8.9 6-15.6Z" />
                    <path fill="#34A853"
                        d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.2c-1.8 1.2-4 1.9-6.8 1.9-5.2 0-9.6-3.5-11.2-8.2H5.9v5.3A20 20 0 0 0 24 44Z" />
                    <path fill="#FBBC05" d="M12.8 27.6a12 12 0 0 1 0-7.2v-5.3H5.9a20 20 0 0 0 0 17.8l6.9-5.3Z" />
                    <path fill="#EA4335"
                        d="M24 12.2c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.9 15.1l6.9 5.3c1.6-4.7 6-8.2 11.2-8.2Z" />
                </svg>
                Continue with Google
            </a>


            <div class="divider"><span>or register with email</span></div>
            <p class="error-message" id="error-message" role="alert" hidden></p>

            <form th:action="@{/auth/register-email}" method="POST">
                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username"
                        autocomplete="username" required>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
                        required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" placeholder="Create a password"
                            autocomplete="new-password" required>
                        <button class="password-toggle" type="button" aria-label="Show password"
                            aria-controls="password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="login-button" type="submit">Create account</button>
            </form>

            <p class="signup-note">Already have an account? <a href="/auth/login">Log in</a></p>
        </section>
    </main>
</body>

</html>

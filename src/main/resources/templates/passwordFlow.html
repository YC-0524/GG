<html>
    <body>
        <div id="loading">
            <span>Loading...</span>
        </div>
        <form id="form" th:action="@{/auth/set-password}" method="POST">
            <input 
                type="password" 
                name="newPassword" 
                id="newPassword" 
                placeholder="New Password" 
            />
            <input 
                type="password" 
                name="confirmPassword" 
                id="confirmPassword" 
                placeholder="Confirm New Passsword" 
            />
            <input 
                type="text" 
                hidden 
                value="FILL_WITH_SECRET"
                id="secretKey"
                name="secretKey"
            />
            <button type="submit" id="submit">Update Password</button>
        </form>

        <script src="/js/passwordFlow.js" defer></script>
    </body>
</html>

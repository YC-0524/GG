<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Gang Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/passwordRules.js" defer></script>
</head>

<body>
    <div class="app-container">
        <nav th:replace="~{sideNavigation :: sideNavigation}"></nav>
        <div class="content-container">
            <div id="loading">
                <span>Loading...</span>
            </div>

            <form id="form" th:action="@{/auth/set-password}" style="display: flex; flex-direction: column; gap: 0.5rem;" method="POST">
                <h2>Password Confirmation</h2>
                <span>To continue, please enter a password you will remember to access your account in the future.</span>
                <p class="error-message" id="error-message" role="alert" hidden></p>
                
                <div>
                    <input type="password" name="newPassword" id="newPassword" placeholder="New Password" autocomplete="new-password" aria-describedby="password-rules" required />

                    <ul class="password-rules" id="passwordRules" aria-label="Password Requirements"
                        data-password-input="newPassword" data-confirm-input="confirmPassword" data-match-message="password-match">
                        <li data-rule="length"><span class="rule-text">At least 8 characters</span><span class="visually-hidden rule-status">, not met</span></li>
                        <li data-rule="upper"><span class="rule-text">One uppercase letter</span><span class="visually-hidden rule-status">, not met</span></li>
                        <li data-rule="lower"><span class="rule-text">One lowercase letter</span><span class="visually-hidden rule-status">, not met</span></li>
                        <li data-rule="number"><span class="rule-text">One number</span><span class="visually-hidden rule-status">, not met</span></li>
                        <li data-rule="symbol"><span class="rule-text">One symbol (e.g. !, @, $, #)</span><span class="visually-hidden rule-status">, not met</span></li>

                    </ul>
                </div>

                <div>
                    <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm New Password" autocomplete="new-password" aria-describedby="password-match" required />
                    <p class="password-match" id="password-match" aria-live="polite"></p>
                </div>
                

                <input type="text" hidden value="FILL_WITH_SECRET" id="secretKey" name="secretKey" />
                <button type="submit" id="submit">Update Password</button>
            </form>
        </div>
    </div>

    <script src="/js/passwordFlow.js" defer></script>
    <script src="/js/passwordRules.js" defer></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profile.username} + ' | GAMG GANG'">Proifle | GAME GANG</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>

<body>
    <div class="app-container">
        <nav th:replace="~{sideNavigation :: sideNavigation}"></nav>
        <div class="profile-container">
            <section class="profile-splash">
                <img class="profile-avatar" th:if="${#strings.isEmpty(profile.avatar)}" src="/images/person.svg" alt="Default Avatar" />
                <img class="profile-avatar" th:unless="${#strings.isEmpty(profile.avatar)}" th:src="@{${profile.avatar}}" alt="User Avatar" referrerpolicy="no-referrer" />
                <h1 th:text="${profile.username}">John Doe</h1>
            </section>
            <section class="profile-section">
                <div th:replace="~{activityStatus :: activityStatus(${user.activityStatus})}"></div>
                <span th:text="'Role: ' + ${profile.role.name()}" style="text-transform: capitalize !important;"></span>
                <span th:text="'Joined GG on ' + ${#dates.format(profile.registered, 'yyyy-MM-dd')}"></span>
            </section>
            <section class="profile-section">
                <div class="profile-games-header">
                    <h2>Games</h2>
                    <a th:if="${isOwner}" th:href="@{/games}">Manage games</a>
                </div>
                <p th:if="${#lists.isEmpty(games)}" class="muted-text">No games added yet</p>
                <ul th:unless="${#lists.isEmpty(games)}" class="profile-games">
                    <li th:each="game : ${games}">
                        <span th:text="${game.gameName}">Valorant</span>
                        <span class="muted-text" th:text="${game.rank}">Gold 2</span>
                    </li>
                </ul>
            </section>
        </div>
    </div>
</body>

</html>

<body>
    <div th:fragment="report(user)" class="report-wrapper">
        <button type="button" class="report-button" onclick="displayReport(this)">Report</button>

        <div class="report-popup" style="display: none;">
            <form method="POST" th:action="@{/report/user}" class="report-form">
                <h2>Report</h2>
                <span th:text="'Reporting: ' + ${user.username}"></span>
                <input type="hidden" name="reportedUserID" th:value="${user.id}">
                <select name="reason">
                    <option value="harassment">Harassment</option>
                    <option value="cheating">Cheating</option>
                    <option value="offensive">Offensive Profile</option>
                    <option value="other">Other</option>
                </select>
                <textarea name="description" minlength="5" maxlength="255" required rows="10"></textarea>
                <button type="submit">Submit</button>
                <button type="button" onclick="hideReport(this)">Cancel</button>
            </form>
        </div>
    </div>
</body>

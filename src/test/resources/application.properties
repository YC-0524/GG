spring.application.name=game

# Discord OAuth test values
discord.oauth.client_id=test-client-id
discord.oauth.client_secret=test-client-secret
discord.oauth.redirect_uri=http://localhost:8080/login/oauth2/code/discord
discord.oauth.oauth_uri=https://discord.com/oauth2/authorize

# Google OAuth test values
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Database
spring.jpa.open-in-view=false

# Server
server.port=8080